    const quad = (k) => {
      ctx.beginPath();
      ctx.moveTo(...P(0,w0*k,1));  ctx.lineTo(...P(1,w1*k,1));
      ctx.lineTo(...P(1,w1*k,-1)); ctx.lineTo(...P(0,w0*k,-1));
      ctx.closePath();
    };
    quad(1);    ctx.fillStyle = shadeColor(b,-56); ctx.fill();
    quad(0.68); ctx.fillStyle = b;                 ctx.fill();
    quad(0.3);  ctx.fillStyle = shadeColor(b,46);  ctx.fill();
    quad(0.12); ctx.fillStyle = accent;            ctx.fill();
    quad(1); ctx.lineWidth = 5; ctx.strokeStyle = UI.ink; ctx.stroke();
  },
  _joint(x, y, r, accent, base) {
    const ctx = this.ctx, b = base || '#5b666f';
    const s = Math.max(10, r*1.6);
    const bx = Math.round(x-s/2), by = Math.round(y-s/2), bs = Math.round(s);
    ctx.fillStyle = shadeColor(b,-48); ctx.fillRect(bx,by,bs,bs);
    ctx.fillStyle = b;                 ctx.fillRect(bx,by,Math.round(bs*0.6),bs);
    ctx.fillStyle = shadeColor(b,44);  ctx.fillRect(bx,by,bs,Math.max(3,bs*0.22));
    ctx.fillStyle = accent;            ctx.fillRect(bx+bs*0.28, by+bs*0.28, bs*0.44, bs*0.44);
    ctx.fillStyle = UI.ink;            ctx.fillRect(bx+bs*0.4,  by+bs*0.4,  bs*0.2,  bs*0.2);
    ctx.lineWidth = 5; ctx.strokeStyle = UI.ink; ctx.strokeRect(bx,by,bs,bs);
  },

  robot(x, y, tier, t) {
    const ctx = this.ctx, R = ROBOT_ARM;
    const accent = tier.accent, S = tier.scale, G = tier.glow;
    const BODY  = mixHex('#5c6773', accent, 0.18 + 0.42*G);
    const LIGHT = shadeColor(BODY, 46), DARK = shadeColor(BODY, -56);
    const bob   = Math.round(Math.sin(t*1.5)*4/4)*4;
    const bodyX = robotBodyX(x);
    const headY = R.HEAD_Y + bob, shY = R.SH_Y + bob;
    const side  = x < bodyX ? -1 : 1;
    const shDX  = R.SH_DX * S, shX = bodyX + side*shDX;
    const W = v => bodyX + v*S;

    const blk = (bx,by,bw,bh,c) => { ctx.fillStyle=c; ctx.fillRect(Math.round(bx),Math.round(by),Math.round(bw),Math.round(bh)); };
    const oblk = (bx,by,bw,bh,c) => {
      blk(bx,by,bw,bh,c);
      ctx.lineWidth=5; ctx.strokeStyle=UI.ink;
      ctx.strokeRect(Math.round(bx),Math.round(by),Math.round(bw),Math.round(bh));
    };
    const body3 = (bx,by,bw,bh) => {
      blk(bx,by,bw,bh,DARK);
      blk(bx,by,bw*0.6,bh,BODY);
      blk(bx,by,bw*0.22,bh,LIGHT);
      blk(bx,by,bw,Math.max(4,bh*0.12),LIGHT);
      ctx.lineWidth=5; ctx.strokeStyle=UI.ink;
      ctx.strokeRect(Math.round(bx),Math.round(by),Math.round(bw),Math.round(bh));
    };

    ctx.save();
    if(G > 0.5) {
      for(let i=2;i>=1;i--) {
        ctx.fillStyle = hexA(accent, 0.035*G*i);
        const w2 = (250 + i*120)*S, h2 = (300 + i*120)*S;
        ctx.fillRect(bodyX-w2/2, shY+60-h2/2, w2, h2);
      }
    }
    if(tier.halo) {
      const ry = headY - 130*S, rw = 106*S;
      oblk(bodyX-rw, ry, rw*2, 15*S, hexA(accent, 0.4));
      const bs = 18*S;
      for(let i=0;i<7;i++) {
        const bx = bodyX - rw + i*((rw*2-bs)/6);
        oblk(bx, ry-5*S, bs, 25*S, i%2 ? hexA(accent,0.95) : '#ffffff');
      }
    }
    for(let i=0;i<tier.pods;i++) {
      const s2 = i%2 ? 1 : -1, k = Math.floor(i/2);
      const ang = t*0.9 + i*1.7;
      const ox = bodyX + s2*(236*S + k*46) + Math.round(Math.sin(ang)*16/4)*4;
      const oy = shY + 34 + k*76 + Math.round(Math.cos(ang)*20/4)*4;
      ctx.fillStyle = hexA(accent, 0.22);
      ctx.fillRect(ox-30*S, oy-30*S, 60*S, 60*S);
      ctx.save(); ctx.translate(ox,oy); ctx.rotate(Math.PI/4);
      oblk(-16*S,-16*S,32*S,32*S, hexA(accent,0.9));
      blk(-6*S,-6*S,12*S,12*S,'#ffffff');
      ctx.restore();
    }

    const yoke = shY - 6;
    body3(W(-166), yoke,        332*S, 80*S);
    body3(W(-150), yoke+80*S,   300*S, 96*S);
    body3(W(-134), yoke+176*S,  268*S, 96*S);
    body3(W(-118), yoke+272*S,  236*S, Math.max(40, SH + 40 - (yoke+272*S)));

    oblk(W(-96), shY+96, 192*S, 152*S, 'rgba(8,12,18,0.7)');
    const core = shY + 172, pulse = 0.6 + Math.sin(t*3.4)*0.4;
    const cs = (46 + 30*G)*S;
    blk(bodyX-cs/2-10, core-cs/2-10, cs+20, cs+20, hexA(accent, 0.18 + 0.3*pulse*G));
    oblk(bodyX-cs/2, core-cs/2, cs, cs, accent);
    blk(bodyX-cs*0.2, core-cs*0.2, cs*0.4, cs*0.4, `rgba(255,255,255,${0.45+0.45*pulse})`);
    for(let i=0;i<3;i++) blk(W(-84), shY+108+i*14*S, 34*S, 6*S, hexA(accent, 0.5));

    body3(W(-38), headY + 92*S, 76*S, Math.max(20, (shY-4) - (headY+92*S)));

    const hw = 112*S, hh = 104*S;
    const hx = bodyX-hw, hy = headY-hh, hW = hw*2, hH = hh*2, nn = 18*S;
    const oct = () => {
      ctx.beginPath();
      ctx.moveTo(hx+nn, hy);         ctx.lineTo(hx+hW-nn, hy);
      ctx.lineTo(hx+hW, hy+nn);      ctx.lineTo(hx+hW, hy+hH-nn);
      ctx.lineTo(hx+hW-nn, hy+hH);   ctx.lineTo(hx+nn, hy+hH);
      ctx.lineTo(hx, hy+hH-nn);      ctx.lineTo(hx, hy+nn);
      ctx.closePath();
    };
    oct(); ctx.fillStyle = DARK; ctx.fill();
    ctx.save(); oct(); ctx.clip();
    blk(hx, hy, hW*0.58, hH, BODY);
    blk(hx, hy, hW*0.2,  hH, LIGHT);
    blk(hx, hy, hW, 12*S, LIGHT);
    ctx.restore();
    oct(); ctx.lineWidth = 5; ctx.strokeStyle = UI.ink; ctx.stroke();

    for(let i=0;i<tier.crown;i++) {
      const s2 = i===0 ? 0 : (i===1 ? -1 : 1);
      const cxp = bodyX + s2*62*S, top = hy + 6*S;
      const hgt = (i===0 ? 46 : 32)*S;
      oblk(cxp-16*S, top-hgt*0.55, 32*S, hgt*0.6, hexA(accent,0.92));
      oblk(cxp-9*S,  top-hgt,      18*S, hgt*0.55, hexA(accent,0.92));
    }
    oblk(bodyX-88*S, headY-56*S, 176*S, 96*S, '#080d14');
    blk(bodyX-88*S, headY-56*S, 176*S, 6*S, hexA(accent, 0.35));
    const gx = clamp((x-bodyX)/SW*2, -1, 1)*14;
    const gy = clamp((y-headY)/SH*2, -1, 1)*8;
    const ew = (15 + 9*G)*S, eh = (9 + 6*G)*S;
    for(const s2 of [-1,1]) {
      const ex = bodyX + s2*44*S + gx, ey = headY - 6*S + gy;
      ctx.fillStyle = hexA(accent, 0.18 + 0.3*G);
      ctx.fillRect(ex-ew*1.8, ey-eh*1.9, ew*3.6, eh*3.8);
      blk(ex-ew, ey-eh, ew*2, eh*2, accent);
      blk(ex-ew*0.5, ey-eh*0.5, ew, eh, `rgba(255,255,255,${0.5+0.45*G})`);
    }
    for(const s2 of [-1,1]) oblk(bodyX + s2*(hw+6*S) - 12*S, headY-24*S, 24*S, 58*S, DARK);
    for(let i=0;i<tier.antenna;i++) {
      const s2 = [1,-1,0][i], lean = tier.antenna > 1 ? 4 : 14;
      const ax0 = bodyX + s2*52*S, ay0 = hy;
      const len2 = (46 + 16*i)*S;
      oblk(ax0 - 5*S + s2*lean*0.5*S, ay0 - len2, 10*S, len2, BODY);
      oblk(ax0 - 11*S + s2*lean*S, ay0 - len2 - 20*S, 22*S, 22*S, accent);
    }

    const pauldron = (px2) => {
      if(!tier.pauldron) return;
      const w2 = (36 + tier.pauldron*10)*S, h2 = (16 + tier.pauldron*5)*S;
      for(let i=0;i<2;i++) {
        const k = 1 - i*0.24;
        body3(px2 - w2*k, shY - 20 + i*h2*0.92, w2*2*k, h2);
      }
      for(let i=0;i<tier.spikes;i++) {
        const span = w2*1.3;
        const sx = px2 - span/2 + (tier.spikes>1 ? i*(span/(tier.spikes-1)) : span/2);
        oblk(sx-6*S, shY - 20 - 18*S, 12*S, 20*S, hexA(accent,0.92));
      }
    };
    pauldron(bodyX - side*shDX);
    this._joint(bodyX - side*shDX, shY, 40*S, accent, BODY);

    const dx = x-shX, dy = y-shY;
    const D  = Math.hypot(dx,dy) || 1;
    const ux = dx/D, uy = dy/D;
    const L  = Math.max(170, D/2 * 1.10);
    const dc = clamp(D, 2, L*2-2);
    const a  = dc/2;
    const hgt2 = Math.sqrt(Math.max(0, L*L - a*a));
    const px = shX + ux*a, py = shY + uy*a;
    const ex = px - uy*hgt2*side, ey = py + ux*hgt2*side;
    let fx = x-ex, fy = y-ey; const fl = Math.hypot(fx,fy)||1; fx/=fl; fy/=fl;
    const fore = Math.max(46, L - R.FING);
    const wx = ex + fx*fore, wy = ey + fy*fore;

    this._plate(shX, shY, ex, ey, 40*S, 30*S, accent, BODY);
    this._joint(shX, shY, 42*S, accent, BODY);
    pauldron(shX);
    this._plate(ex, ey, wx, wy, 30*S, 22*S, accent, BODY);
    this._joint(ex, ey, 24*S, accent, BODY);

    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(Math.atan2(fy, fx) - Math.PI/2);
    blk(-26,-22,52,48,DARK);
    blk(-26,-22,30,48,BODY);
    blk(-26,-22,52,7,LIGHT);
    ctx.lineWidth=5; ctx.strokeStyle=UI.ink; ctx.strokeRect(-26,-22,52,48);
    for(let i=0;i<3;i++) oblk(-21+i*15, 20, 12, 20, DARK);
    oblk(18,-8,13,24,DARK);
    ctx.restore();

    const kx = wx + fx*R.FING*0.5, ky = wy + fy*R.FING*0.5;
    this._plate(wx + fx*8, wy + fy*8, kx, ky, 14, 11, accent, BODY);
    this._plate(kx, ky, x, y, 11, 7, accent, BODY);
    this._joint(kx, ky, 9, accent, BODY);

    const fr = 18 + 12*G;
    ctx.fillStyle = hexA(accent, 0.35);        ctx.fillRect(x-fr, y-fr, fr*2, fr*2);
    ctx.fillStyle = hexA(accent, 0.85);        ctx.fillRect(x-fr*0.6, y-fr*0.6, fr*1.2, fr*1.2);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';  ctx.fillRect(x-fr*0.26, y-fr*0.26, fr*0.52, fr*0.52);
    ctx.restore();
  },
});

const _sliceBase = GameSim.prototype._slice;
GameSim.prototype._slice = function(segments) {
  const before = this._cCount;
  _sliceBase.call(this, segments);
  const n = this._cCount - before;
  if(n > 1) {
    this.effects.addShake(5 + n*3.5);
    this.effects.addFlash(0.10 + n*0.035);
  }
};

if(document.fonts && document.fonts.load) {
  ['400 16px "Press Start 2P"', '400 16px Galmuri14', '400 16px Galmuri11']
    .forEach(f => { try { document.fonts.load(f, '0사람'); } catch(e) {} });
}

// ═══════════════ 부트 ═══════════════
(async function() {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const video  = document.getElementById('v');
  const menuEl = document.getElementById('menu');
  const hud    = document.getElementById('hud');
  const audio  = new AudioEngine();
  const booth  = new Booth(canvas, audio);

  let _lw=0, _lh=0, _ldpr=0;
  function ensureSize() {
    const dpr = Math.min(window.devicePixelRatio||1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    if(w===_lw && h===_lh && dpr===_ldpr) return;
    _lw=w; _lh=h; _ldpr=dpr;
    canvas.width  = Math.round(w*dpr);
    canvas.height = Math.round(h*dpr);
    canvas.style.width  = w+'px';
    canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    hud.style.top = Math.round(booth.layout().headerH/2) + 'px';
  }
  ensureSize();

  // ── 메뉴 구성 ──
  const HUMAN_ROWS = [
    '................',
    '.....oooooo.....',
    '....ohhhhhho....',
    '....ohhhhhho..w.',
    '....osssssso..w.',
    '....oseseso..w..',
    '....ossssso..w..',
    '.....oooo...w...',
    '...oobbbbboog...',
    '..obbbbbbbbo....',
    '..obbbbbbbbo....',
    '...obbbbbbo.....',
    '....oppppo......',
    '....op..po......',
    '...opp..ppo.....',
    '...ooo..ooo.....',
  ];
  const ROBOT_ROWS = [
    '........g.......',
    '........g.......',
    '.......oao......',
    '....oooooooo....',
    '...oAAAAAAAAo...',
    '...oaeeaaeeao...',
    '...oaaaaaaaao...',
    '...okaaaaaako...',
    '....oooooooo....',
    '..ooaaaaaaaaoo..',
    '..oaaoaaaaoaao..',
    '..oaaoaaaaoaao..',
    '...oo.oaaao.oo..',
    '......oaaao.....',
    '.....oaao.oaao..',
    '.....ooo...ooo..',
  ];
  function spriteBox(rows, pal, px) {
    const w = Math.max(...rows.map(r=>r.length));
    const box = document.createElement('span');
    box.className = 'sp';
    box.style.cssText = `display:block;position:relative;width:${w*px}px;height:${rows.length*px}px`;
    const parts = [];
    rows.forEach((row,y)=>[...row].forEach((ch,x)=>{
      const c = pal[ch]; if(c) parts.push(`${x*px}px ${y*px}px 0 0 ${c}`);
    }));
    const dot = document.createElement('span');
    dot.style.cssText = `position:absolute;left:0;top:0;width:${px}px;height:${px}px;box-shadow:${parts.join(',')}`;
    box.appendChild(dot);
    return box;
  }
  const figH = document.getElementById('fig-human');
  const figR = document.getElementById('fig-robot');
  function buildFigs() {
    const px = Math.max(5, Math.min(12, Math.round(window.innerHeight/96)));
    const T = tierFor(booth.level);
    const hPal = {o:'#0b0f16',h:'#2b1d16',s:'#f5c08a',e:'#0b0f16',b:'#4deeea',p:'#2b3542',w:'#ffffff',g:'#ffd23f'};
    const rPal = {o:'#0b0f16',a:T.accent,A:shadeColor(T.accent,38),k:shadeColor(T.accent,-42),e:'#ffffff',g:'#ffd23f'};
    figH.querySelector('.sp').replaceWith(spriteBox(HUMAN_ROWS,hPal,px));
    figR.querySelector('.sp').replaceWith(spriteBox(ROBOT_ROWS,rPal,px));
    figR.style.setProperty('--tier', T.accent);
    document.getElementById('fig-robot-tag').textContent = `${T.name} · ${T.lv.toLocaleString()}판`;
  }
  window.addEventListener('resize', buildFigs);

  const levelsEl = document.getElementById('levels');
  ROBOT_TIERS.forEach(T=>{
    const b = document.createElement('button');
    b.className='lvl'; b.type='button';
    b.style.setProperty('--tier', T.accent);
    b.setAttribute('aria-pressed', String(T.lv===booth.level));
    b.innerHTML = `<span class="lv">LV.${ROBOT_TIERS.indexOf(T)+1}</span>`
                + `<span class="n">${T.lv.toLocaleString()}</span>`
                + `<span class="u">${T.name}</span>`;
    b.addEventListener('click', ()=>{
      booth.level = T.lv;
      [...levelsEl.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      buildFigs();
    });
    levelsEl.appendChild(b);
  });
  const variantsEl = document.getElementById('variants');
  const vrDesc = document.getElementById('vr-desc');
  VARIANTS.forEach(v=>{
    const b = document.createElement('button');
    b.className='vr'; b.type='button';
    b.setAttribute('aria-pressed', String(v.id===booth.variant));
    b.innerHTML = `<span class="t">${v.name}</span><span class="d">${v.desc}</span>`;
    if(v.id===booth.variant) vrDesc.textContent = v.desc;
    b.addEventListener('click', ()=>{
      booth.variant = v.id;
      [...variantsEl.children].forEach(c=>c.setAttribute('aria-pressed','false'));
      b.setAttribute('aria-pressed','true');
      vrDesc.textContent = v.desc;
    });
    variantsEl.appendChild(b);
  });
  buildFigs();

  // ── 학습 가중치 로드 ──
  const weightNote = document.getElementById('weight-note');
  async function loadWeights(level) {
    try {
      const res = await fetch(`weights/dqn_${level}.json`, {cache:'no-store'});
      if(!res.ok) throw 0;
      const j = await res.json();
      booth.weights = {
        W1:Float32Array.from(j.W1), b1:Float32Array.from(j.b1),
        W2:Float32Array.from(j.W2), b2:Float32Array.from(j.b2),
        W3:Float32Array.from(j.W3), b3:Float32Array.from(j.b3),
      };
      weightNote.textContent = `DQN 가중치 로드됨 — ${level.toLocaleString()}판 체크포인트`;
      weightNote.classList.add('loaded');
    } catch(e) {
      booth.weights = null;
      weightNote.textContent = '학습 가중치 미탑재 — 임시 정책으로 동작 중';
      weightNote.classList.remove('loaded');
    }
  }

  function showMenu() {
    booth.state = MENU;
    menuEl.classList.remove('hidden');
  }
  let starting = false;
  async function startMatch() {
    if(starting) return;
    starting = true;
    audio._unlock();                 // iOS는 사용자 터치 안에서 바로 깨워야 소리가 난다
    try { await loadWeights(booth.level); } finally { starting = false; }
    menuEl.classList.add('hidden');
    booth.start();
  }
  document.getElementById('start-btn').addEventListener('click', startMatch);
  document.getElementById('hud-retry').addEventListener('click', startMatch);
  document.getElementById('hud-menu').addEventListener('click', showMenu);
  window.addEventListener('keydown', e=>{
    if(e.code==='Escape') { showMenu(); }
    else if(e.code==='KeyR' && booth.state!==MENU) { startMatch(); }
    else if(e.code==='Space' && booth.state===MENU) { e.preventDefault(); startMatch(); }
  });
  ['touchend','pointerup','click','keydown'].forEach(ev =>
    window.addEventListener(ev, ()=>audio._unlock(), {passive:true}));
  // iOS 사파리 — 두 손가락 확대가 경기 중에 끼어들지 않게
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ── 전체화면 (지원하는 기기에서만) ──
  const fsBtn = document.getElementById('fs-btn');
  const root = document.documentElement;
  if(!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.style.display = 'none';
  fsBtn.addEventListener('click', ()=>{
    try {
      const on = document.fullscreenElement || document.webkitFullscreenElement;
      const r = on ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
                   : (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
      if(r && r.catch) r.catch(()=>{});
    } catch(e) {}
  });

  // ── 터치 입력 — 손가락 하나만 칼로 쓴다 (마우스 드래그도 같은 경로) ──
  let touchId = null;
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    audio._unlock();
    const btn = booth.resultButtonAt(e.clientX, e.clientY);
    if(btn === 'retry') { startMatch(); return; }
    if(btn === 'menu')  { showMenu();  return; }
    if(touchId !== null) return;
    touchId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
    booth.setTouch(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', e => {
    if(e.pointerId === touchId) booth.setTouch(e.clientX, e.clientY);
  });
  const endTouch = e => {
    if(e.pointerId !== touchId) return;
    touchId = null;
    booth.releaseTouch();
  };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);

  // ── MediaPipe Hands — 검지 끝(8번)을 칼끝으로 사용 ──
  // 터치로만 하는 패드에서는 받을 필요가 없어, 카메라를 고를 때 처음 불러온다
  const HANDS_CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/';
  let handPoint = null, hands = null, stream = null, camWanted = false, camBusy = false, detecting = false;
  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.crossOrigin = 'anonymous'; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }
  /* 원거리 대응 — 모델은 입력을 200px 남짓으로 줄여 보므로, 경기장에 쓰는 가운데 영역만
     잘라 보내면 같은 손이 두 배 넘게 크게 잡힌다. 결과 좌표는 다시 전체 영상 기준으로 되돌린다. */
  const cropCv = document.createElement('canvas'), cropCtx = cropCv.getContext('2d');
  let cropBox = { x0:0, w:1, y0:0, h:1 };
  // One Euro 필터 — 천천히 움직일 땐 떨림을 누르고, 빠르게 휘두를 땐 거의 지연이 없다
  class OneEuro {
    constructor(minCut=1.4, beta=0.02, dCut=1.0) { this.minCut=minCut; this.beta=beta; this.dCut=dCut; this.x=null; this.dx=0; this.t=0; }
    static a(cut, dt) { const r = 2*Math.PI*cut*dt; return r/(r+1); }
    filter(v, t) {
      if(this.x === null || t - this.t > 0.3) { this.x = v; this.dx = 0; this.t = t; return v; }
      const dt = Math.max(1e-3, t - this.t); this.t = t;
      const d = (v - this.x)/dt;
      this.dx += OneEuro.a(this.dCut, dt)*(d - this.dx);
      const cut = this.minCut + this.beta*Math.abs(this.dx)*1000;
      this.x += OneEuro.a(cut, dt)*(v - this.x);
      return this.x;
    }
  }
  const fx = new OneEuro(), fy = new OneEuro();
  let lastDetect = 0;
  const detect = async ts => {
    if(!stream) { detecting = false; return; }
    if(ts - lastDetect > 33 && video.videoWidth) {
      lastDetect = ts;
      const b = booth._camBox(video);
      cropBox = b;
      const sw = Math.round(b.w*video.videoWidth), sh = Math.round(b.h*video.videoHeight);
      if(cropCv.width !== sw || cropCv.height !== sh) { cropCv.width = sw; cropCv.height = sh; }
      cropCtx.drawImage(video, b.x0*video.videoWidth, b.y0*video.videoHeight, sw, sh, 0, 0, sw, sh);
      try { await hands.send({image:cropCv}); } catch(e){}
    }
    requestAnimationFrame(detect);
  };
  async function startCamera() {
    camWanted = true;
    if(stream || camBusy) return;
    camBusy = true;
    try {
      if(!hands) {
        if(typeof Hands === 'undefined') await loadScript(HANDS_CDN + 'hands.js');
        hands = new Hands({ locateFile: f => HANDS_CDN + f });
        hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.3, minTrackingConfidence:0.4, selfieMode:false });
        hands.onResults(res => {
          const lm = stream && res.multiHandLandmarks?.[0];
          if(!lm) { handPoint = null; return; }
          const t = performance.now()/1000, b = cropBox;
          handPoint = { nx: fx.filter(b.x0 + lm[8].x*b.w, t), ny: fy.filter(b.y0 + lm[8].y*b.h, t) };
        });
      }
      const s = await navigator.mediaDevices.getUserMedia({ video:{ width:{ideal:1920}, height:{ideal:1080}, facingMode:'user' } });
      if(!camWanted) { s.getTracks().forEach(t=>t.stop()); return; }
      stream = s;
      video.srcObject = s;
      await new Promise(r => { if(video.readyState >= 1) r(); else video.onloadedmetadata = r; });
      video.play();
      booth.camFrame = video;
      if(!detecting) { detecting = true; requestAnimationFrame(detect); }
    } catch(e) {
      console.warn('카메라 사용 불가:', e);
      if(camWanted) camNote.textContent = '카메라를 사용할 수 없습니다 — 터치로 바꿔 플레이하세요';
    } finally { camBusy = false; }
  }
  function stopCamera() {
    camWanted = false;
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream = null; handPoint = null; booth.camFrame = null;
    video.srcObject = null;
  }

  // ── 입력 방식 — 패드는 터치, 부스 PC는 카메라가 기본 ──
  const INPUT_MODES = [
    { id:'touch',  name:'터치',   desc:'화면을 손가락으로 그어 과일을 베세요' },
    { id:'camera', name:'카메라', desc:'카메라 앞에서 손을 펴고 휘두르세요 · 검지 끝이 칼끝' },
  ];
  const inputsEl = document.getElementById('inputs');
  const camNote  = document.getElementById('cam-note');
  const isTouchDevice = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;
  let inputMode = isTouchDevice ? 'touch' : 'camera';
  try { const saved = localStorage.getItem('fruitduel.input'); if(saved==='touch' || saved==='camera') inputMode = saved; } catch(e) {}
  function setInputMode(id) {
    inputMode = id;
    try { localStorage.setItem('fruitduel.input', id); } catch(e) {}
    [...inputsEl.children].forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.id===id)));
    camNote.textContent = INPUT_MODES.find(m=>m.id===id).desc;
    if(id === 'camera') startCamera(); else stopCamera();
  }
  INPUT_MODES.forEach(m=>{
    const b = document.createElement('button');
    b.className='vr'; b.type='button'; b.dataset.id = m.id;
    b.innerHTML = `<span class="t">${m.name}</span>`;
    b.addEventListener('click', ()=>setInputMode(m.id));
    inputsEl.appendChild(b);
  });
  setInputMode(inputMode);

  // ── 루프 ──
  let lastT = performance.now(), hudShown = false;
  const loop = ts => {
    requestAnimationFrame(loop);
    const dtReal = Math.min(0.05, (ts-lastT)/1000);
    lastT = ts;
    try {
      ensureSize();
      const dbg = window.__debugHand;
      const hand = typeof dbg === 'function' ? dbg(ts) : (dbg || handPoint);
      booth.update(dtReal, hand);
      booth.render();
      const show = booth.state===COUNTDOWN || booth.state===DUEL;
      if(show !== hudShown) { hudShown = show; hud.classList.toggle('hidden', !show); }
    } catch(err) { console.error('loop error:', err); }
  };
  requestAnimationFrame(loop);

  window.__booth = booth;
})();
</script>
